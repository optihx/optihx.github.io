<style>
/* ==========================================================
   opti'H ✗ — accueil épuré
   Les jaquettes parlent, le reste se tait : une police, deux gris,
   et la couleur de chaque jeu seulement là où elle sert.
   ========================================================== */
:root{
  --fond:#0f1420;--encre:#eef0f4;--doux:#8e97aa;--trait:rgba(255,255,255,.09);--case:#1a2130;
  --sig:none;--ease:cubic-bezier(.16,1,.3,1);--g:clamp(16px,4.5vw,64px)}
html[data-theme="clair"]{--fond:#f3f4f6;--encre:#151b28;--doux:#5b6377;--trait:#dde1e7;--case:#e4e7ec;
  --sig:brightness(0) saturate(100%) invert(9%) sepia(20%) saturate(1400%) hue-rotate(190deg)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--encre)}
body{font:400 15px/1.5 "Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--encre);outline-offset:3px;border-radius:6px}
.ico{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* --- En-tête --- */
.tete{display:flex;align-items:center;gap:28px;max-width:1360px;margin:0 auto;padding:26px var(--g) 0}
.moi{display:flex;align-items:center;gap:12px;margin-right:auto}
.moi img{height:42px;width:auto;filter:var(--sig)}
.moi strong{font-weight:600;font-size:17px}
.reseaux{display:flex;gap:20px;font-size:14px;color:var(--doux)}
.reseaux a{transition:color .2s}
.reseaux a:hover{color:var(--encre)}
.actions{display:flex;align-items:center;gap:6px}
.tete .notif-btn,.tete .install,.tete .theme-btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 12px;border:1px solid var(--trait);border-radius:999px;
  background:transparent;color:var(--doux);font:500 13px/1 "Figtree",system-ui,sans-serif;cursor:pointer;opacity:1;transition:color .2s,border-color .2s}
.tete .notif-btn:hover,.tete .install:hover,.tete .theme-btn:hover,.tete .notif-btn[aria-expanded="true"]{color:var(--encre);border-color:var(--doux)}
.tete .notif-btn.on{color:var(--encre);border-color:var(--encre)}
.tete .notif-btn svg,.tete .install svg,.tete .theme-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-slot{margin:0}

/* --- Titre + onglets --- */
main{max-width:1360px;margin:0 auto;padding:0 var(--g)}
.barre{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:clamp(48px,9vh,96px) 0 28px;border-bottom:1px solid var(--trait)}
.barre h1{margin:0 0 16px;font-weight:600;font-size:clamp(26px,2.6vw,34px);line-height:1.1;letter-spacing:-.02em}
.vues{display:flex;gap:26px}
.vues button{position:relative;padding:0 0 16px;border:0;background:none;color:var(--doux);font:500 15px/1 "Figtree",system-ui,sans-serif;cursor:pointer;transition:color .2s}
.vues button:hover{color:var(--encre)}
.vues button[aria-selected="true"]{color:var(--encre)}
.vues button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--encre)}
.vue[hidden]{display:none}

/* --- Jeux : jaquette, nom, phrase, raccourcis --- */
.jeux{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:44px clamp(20px,2vw,28px)}
.jeu{display:flex;flex-direction:column;min-width:0}
.jaq{position:relative;display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--case)}
.jaq img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%);transition:transform .8s var(--ease)}
.jaq::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.jeu:hover .jaq img,.jaq:focus-visible img{transform:scale(1.04)}
.jeu:hover .jaq::after,.jaq:focus-visible::after{transform:none}
.jaq:focus-visible{outline-offset:4px}
.info{padding-top:16px}
.titre{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.titre a{font-weight:600;font-size:18px;line-height:1.25;letter-spacing:-.01em}
.titre span{flex:none;font-size:13px;color:var(--doux)}
.info p{margin:6px 0 0;color:var(--doux);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.raccourcis{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--trait)}
.raccourcis a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;font-weight:500;transition:color .2s}
.raccourcis a .ico{color:var(--doux);transition:transform .25s var(--ease),color .2s}
.raccourcis a:hover{color:var(--c)}
.raccourcis a:hover .ico{color:var(--c);transform:translateX(3px)}

/* --- Boîte à outils --- */
.outils{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:48px clamp(28px,4vw,56px)}
.grp h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-weight:600;font-size:16px}
.grp h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.grp ul{list-style:none;margin:0;padding:0}
.grp li+li{border-top:1px solid var(--trait)}
.grp a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 0}
.grp b{font-weight:500}
.grp small{display:block;margin-top:1px;color:var(--doux);font-size:13.5px}
.grp a .ico{color:var(--doux);transition:color .2s,transform .25s var(--ease)}
.grp a:hover b{color:var(--c)}
.grp a:hover .ico{color:var(--c);transform:translateX(2px)}

footer{max-width:1360px;margin:0 auto;padding:72px var(--g) 40px;color:var(--doux);font-size:13px}

/* --- Téléphone : une ligne par jeu --- */
@media (max-width:760px){
  .tete{flex-wrap:wrap;gap:14px 18px;padding-top:18px}
  .moi{width:100%}
  .actions{flex-wrap:wrap}
  .barre{margin-top:36px}
  .barre h1{display:none}
  .vues{gap:22px}
  .jeux{grid-template-columns:minmax(0,1fr);gap:0}
  .jeu{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--trait)}
  .jeu:first-child{padding-top:4px}
  .jaq{aspect-ratio:3/4;border-radius:8px;align-self:start}
  .info{padding-top:2px}
  .titre a{font-size:17px}
  .raccourcis{margin-top:10px;padding-top:6px}
  .raccourcis a{padding:6px 0}
  html.avec-onglets footer{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="tete">
  <a class="moi" href="index.html"><img src="assets/img/logo-oph.png" alt="Signature Oph" width="217" height="312"><strong>opti'H ✗</strong></a>
  <nav class="reseaux" aria-label="Réseaux">
    <a href="https://www.twitch.tv/optihx" target="_blank" rel="noopener">Twitch</a>
    <a href="https://www.youtube.com/channel/UCbsyoLEn1X7zsgnFkT7AQWQ" target="_blank" rel="noopener">YouTube</a>
    <a href="https://x.com/opti_h" target="_blank" rel="noopener">X</a>
    <a href="https://discord.gg/27Zrvf" target="_blank" rel="noopener">Discord</a>
  </nav>
  <div class="actions">
    <button type="button" class="notif-btn" data-synchro><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg><span>Synchro</span></button>
    <button type="button" class="notif-btn" data-notifs><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg><span>Notifications</span></button>
    <button type="button" class="install" data-installer hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Installer l'appli</button>
    <span class="theme-slot" data-theme-slot></span>
  </div>
</header>

<main>
  <div class="barre">
    <h1>Mes jeux</h1>
    <div class="vues" role="tablist" aria-label="Rubriques">
      <button type="button" role="tab" id="t-jeux" aria-controls="jeux" aria-selected="true">Jeux</button>
      <button type="button" role="tab" id="t-outils" aria-controls="outils" aria-selected="false" tabindex="-1">Boîte à outils</button>
    </div>
  </div>

  <section class="vue" id="jeux" role="tabpanel" aria-labelledby="t-jeux">
    <ul class="jeux" id="liste"></ul>
  </section>
  <section class="vue" id="outils" role="tabpanel" aria-labelledby="t-outils" hidden>
    <div class="outils" id="outils-list"></div>
  </section>
</main>

<footer>© opti'H ✗</footer>

<script src="assets/js/jeux.js"></script>
<script src="assets/js/outils.js"></script>
<script>
(function(){
  var J=window.JEUX||[],O=window.OUTILS||[];
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  var FL='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
      EXT='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
  /* Cadrage des jaquettes qui ne sont pas en portrait */
  var CADRE={"OP France":"80% 40%","Tower of God":"58% 50%"};
  /* Sur fond clair, les couleurs trop pâles (jaunes, turquoises) sont assombries pour rester lisibles */
  function lisible(hex){
    if(document.documentElement.getAttribute('data-theme')!=='clair')return hex;
    var n=parseInt(String(hex).slice(1),16),r=n>>16,g=n>>8&255,b=n&255,l=(.299*r+.587*g+.114*b)/255;
    if(l<.55)return hex;var k=.55/l*.8;return 'rgb('+Math.round(r*k)+','+Math.round(g*k)+','+Math.round(b*k)+')';
  }
  function outilsDe(nom){var g=O.filter(function(x){return x.groupe===nom})[0];return g?(g.liens||[]).filter(function(l){return l.mien}).slice(0,3):[]}

  function dessiner(){
    document.getElementById('liste').innerHTML=J.map(function(j){
      var r=outilsDe(j.nom),pos=CADRE[j.nom]?';--pos:'+CADRE[j.nom]:'';
      return '<li class="jeu" style="--c:'+lisible(j.couleur)+pos+'">'+
        '<a class="jaq" href="'+esc(j.lien)+'" tabindex="-1" aria-hidden="true">'+(j.image?'<img src="'+esc(j.image)+'" alt="" loading="lazy" width="900" height="1200">':'')+'</a>'+
        '<div class="info"><div class="titre"><a href="'+esc(j.lien)+'">'+esc(j.nom)+'</a><span>'+esc(j.type)+'</span></div>'+
        '<p>'+esc(j.texte)+'</p>'+
        (r.length?'<ul class="raccourcis">'+r.map(function(l){return '<li><a href="'+esc(l.lien)+'">'+esc(l.nom)+FL+'</a></li>'}).join('')+'</ul>':'')+
        '</div></li>';
    }).join('');
    document.getElementById('outils-list').innerHTML=O.map(function(g){
      return '<section class="grp" style="--c:'+lisible(g.couleur||'#8e97aa')+'"><h2>'+esc(g.groupe)+'</h2><ul>'+(g.liens||[]).map(function(l){
        var x=/^https?:/.test(l.lien);
        return '<li><a href="'+esc(l.lien)+'"'+(x?' target="_blank" rel="noopener"':'')+'><span><b>'+esc(l.nom)+'</b>'+(l.texte?'<small>'+esc(l.texte)+'</small>':'')+'</span>'+(x?EXT:FL)+'</a></li>';
      }).join('')+'</ul></section>';
    }).join('');
  }
  dessiner();
  new MutationObserver(dessiner).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  /* Onglets : #outils dans l'adresse ouvre directement la boîte à outils */
  var tabs=[].slice.call(document.querySelectorAll('.vues [role="tab"]'));
  function show(id,maj){
    tabs.forEach(function(t){var on=t.getAttribute('aria-controls')===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on});
    if(maj)history.replaceState(null,'',id==='outils'?'#outils':location.pathname+location.search);
  }
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){show(t.getAttribute('aria-controls'),true)});
    t.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];n.focus();n.click()}});
  });
  if(location.hash==='#outils')show('outils');
  addEventListener('hashchange',function(){show(location.hash==='#outils'?'outils':'jeux')});
})();
</script>
<script src="assets/js/notifs.js"></script>
<script src="assets/js/carte-joueur.js"></script>
<script src="assets/js/app.js"></script>
</body>
